<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tarihi">
  <!--
    The mark is a T built out of a ledger rule.
    The crossbar is the ruled line of a daybook page; the stem hangs from it; the
    sage bar beneath is an entry written on that line. Same idea as the app's
    daybook screens, so the icon and the product agree with each other.
  -->
  <rect width="64" height="64" rx="14" fill="#c85a2e"/>
  <rect x="13" y="20" width="38" height="5.5" rx="2.75" fill="#f8f7f5"/>
  <rect x="29.25" y="20" width="5.5" height="25" rx="2.75" fill="#f8f7f5"/>
  <rect x="39" y="32.5" width="12" height="5" rx="2.5" fill="#4f9469"/>
</svg>
