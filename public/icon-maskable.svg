<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tarihi">
  <!-- Maskable: Android crops to a circle, so the mark sits inside the safe
       zone (centre 80%) and the terracotta runs full bleed. -->
  <rect width="64" height="64" fill="#c85a2e"/>
  <g transform="translate(32 32) scale(0.66) translate(-32 -32)">
    <rect x="13" y="20" width="38" height="5.5" rx="2.75" fill="#f8f7f5"/>
    <rect x="29.25" y="20" width="5.5" height="25" rx="2.75" fill="#f8f7f5"/>
    <rect x="39" y="32.5" width="12" height="5" rx="2.5" fill="#4f9469"/>
  </g>
</svg>
