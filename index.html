    <style>
      /* Shown before any JavaScript runs, so it is deliberately self-contained
         and uses the brand colours directly rather than CSS variables. */
      #app-boot-loading {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f7f5;
        color: #7a6a5f;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      #app-boot-loading .inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        font-size: 14px;
      }
      #app-boot-loading svg { width: 56px; height: 56px; }
      #app-boot-loading .bar {
        width: 96px;
        height: 3px;
        border-radius: 999px;
        background: #e6ddd4;
        overflow: hidden;
      }
      #app-boot-loading .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #c85a2e;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="app-boot-loading">
        <div class="inner">
          <svg viewBox="0 0 64 64" aria-label="Tarihi">

            <rect x="13" y="20" width="38" height="5.5" rx="2.75" fill="#f8f7f5"/>
            <rect x="29.25" y="20" width="5.5" height="25" rx="2.75" fill="#f8f7f5"/>
            <rect x="39" y="32.5" width="12" height="5" rx="2.5" fill="#4f9469"/>
          </svg>
          <div class="bar"><span></span></div>
        </div>
      </div>
    </div>
